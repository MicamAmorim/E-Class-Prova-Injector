name: Testar extensão
on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos arquivos JavaScript
        run: |
          for file in ./*.js; do node --check "$file"; done
      - name: Testes (Node nativo)
        run: node --test tests/*.test.js
